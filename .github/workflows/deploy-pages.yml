name: Deploy Taiwan activity website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static website
        run: |
          mkdir -p dist/data
          cp index.html admin.html dist/
          cp -r services utils dist/
          cp data/app-config.js data/taiwan.js data/tourism-events-preview.js dist/data/
          printf 'window.ADMIN_EVENTS = [];\n' > dist/data/admin-events.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
