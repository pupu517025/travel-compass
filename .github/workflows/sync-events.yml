name: Sync Taiwan events

on:
  schedule:
    - cron: '10 19 * * *' # 03:10 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  sync-events:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import Tourism Administration feed
        run: node scripts/sync-tourism-events.mjs
      - name: Collect official county calendars
        run: node scripts/sync-county-events.mjs
      - name: Sync activity data to Supabase
        run: node scripts/sync-supabase-events.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Save refreshed event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tourism-events-preview.js data/county-source-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync Taiwan activity listings"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static website
        run: |
          mkdir -p dist/data
          cp index.html admin.html dist/
          cp -r services utils dist/
          cp data/app-config.js data/taiwan.js data/tourism-events-preview.js dist/data/
          printf 'window.ADMIN_EVENTS = [];\n' > dist/data/admin-events.js
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        uses: actions/deploy-pages@v4
        id: deployment
