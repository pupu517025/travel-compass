:root{--ink:#243b32;--muted:#75847c;--green:#35634f;--mint:#e9f0e9;--cream:#f6f5ef;--line:#e5e7df;--orange:#d7784e;--white:#fff;--shadow:0 14px 44px #29443a0d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:0 30px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;background:var(--green);border-radius:12px;color:#fff;display:grid;place-items:center}.navlinks{display:flex;gap:9px}.navlinks button,.outline{background:white;border:1px solid var(--line);border-radius:10px;color:var(--green);padding:9px 12px;font-size:12px;font-weight:700}.navlinks button.active{background:var(--green);color:white;border-color:var(--green)}.drawing{animation:shake .13s infinite alternate}@keyframes shake{to{transform:rotate(4deg) translateY(-2px)}}.hero{padding:54px 0 31px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--green)}h1{font-size:clamp(36px,5vw,56px);line-height:1.16;letter-spacing:-.04em;margin:13px 0}.hero p{color:var(--muted);line-height:1.8;margin:0;max-width:570px}.heroSide{max-width:270px;font-size:12px;color:var(--muted);line-height:1.7;padding:18px;border-radius:16px;background:#eaf0e8}.workspace{display:grid;grid-template-columns:330px 1fr;gap:20px;padding-bottom:50px}.workspace.overviewMode{grid-template-columns:1fr}.panel,.results{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:22px;height:max-content}.panel h2,.results h2{font-size:17px;margin:0}.panelhead,.resulttop{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.label{display:block;font-weight:700;font-size:12px;margin-bottom:7px}.field{margin-bottom:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}select{width:100%;height:42px;background:white;border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--ink)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:#586c61;font-size:11px}.chip.active{background:var(--mint);border-color:#adc6b2;color:var(--green);font-weight:700}.toggle{display:flex;align-items:center;justify-content:space-between;background:#f8f8f5;border-radius:11px;padding:12px}.toggle b{font-size:12px}.switch{border:0;width:42px;height:24px;border-radius:18px;background:#cbd2cd;position:relative}.switch:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{left:21px}.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:13px 16px;font-weight:700;width:100%}.random{margin-top:9px;background:#fff6ee;border:1px solid #f3d9c8;color:#a85e3d}.results{padding:23px;min-height:480px}.resulttop p{font-size:12px;color:var(--muted);margin:5px 0 0}.actions{display:flex;gap:7px}.outline{white-space:nowrap}.status{font-size:11px;color:var(--muted);margin-bottom:14px}.cards{display:grid;gap:11px}.card{border:1px solid var(--line);border-radius:15px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:14px}.card h3{font-size:16px;margin:0 0 8px}.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}.tag{background:#f1f4ef;padding:4px 8px;border-radius:6px;color:#596d61}.tag.hot{color:#a75431;background:#fff0e7}.summary{font-size:12px;line-height:1.65;color:#68786f;margin:11px 0 8px}.eta{font-size:12px;font-weight:700;color:var(--green)}.cardActions{display:flex;flex-direction:column;gap:7px;align-items:flex-end}.cardActions a,.cardActions button{border:1px solid var(--line);background:white;color:var(--green);border-radius:8px;padding:7px 9px;text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap}.cardActions .saved{color:var(--orange)}.empty{min-height:300px;display:grid;place-content:center;text-align:center;color:var(--muted);gap:8px}.empty strong{color:var(--ink)}.empty div{max-width:340px;font-size:12px;line-height:1.7}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:12px;z-index:8;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none;position:fixed;inset:0;background:#172820bb;z-index:5;padding:5vh 15px;overflow:auto}.overlay.open{display:block}.modal{max-width:860px;margin:auto;background:white;border-radius:18px;padding:25px;position:relative}.close{position:absolute;right:17px;top:14px;border:0;border-radius:50%;width:34px;height:34px;background:#f1f3ee;font-size:19px}.modal p{font-size:12px;color:var(--muted)}.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.badge{border:1px solid var(--line);border-radius:11px;padding:12px;font-size:12px}.badge small{display:block;color:var(--muted);margin-top:5px}.badge.on{background:var(--mint);border-color:#b5cbb7}footer{padding:18px 0 30px;border-top:1px solid var(--line);font-size:11px;color:#86928a;display:flex;justify-content:space-between}
@media(max-width:800px){.shell{padding:0 17px}.hero{padding:39px 0 24px;display:block}.heroSide{margin-top:17px;max-width:none}.workspace{grid-template-columns:1fr;gap:13px}.panel,.results{padding:18px}.resulttop{align-items:flex-start}.card{grid-template-columns:1fr}.cardActions{flex-direction:row;align-items:center;flex-wrap:wrap}.navlinks button{font-size:10px;padding:8px}.hero p{font-size:14px}}@media(max-width:470px){.nav{height:auto;min-height:62px;align-items:flex-start;padding:9px 0;gap:8px;flex-direction:column}.navlinks{gap:4px;max-width:100%;overflow:auto}.navlinks button{padding:7px;font-size:10px;white-space:nowrap}.resulttop{display:block}.actions{margin-top:12px}.card h3{font-size:15px}footer{gap:12px;flex-direction:column}}
.countyChips{overflow:auto;flex-wrap:nowrap;padding:4px 1px 12px;scrollbar-width:thin}.countyChips .chip{white-space:nowrap}.countyChips .chip.active{background:var(--green);color:#fff}.toolbar{display:grid;grid-template-columns:1fr 210px auto;gap:9px;margin:3px 0 18px}.toolbar input,.toolbar select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px}.kidFilter{font-size:11px;color:var(--muted);display:flex;align-items:center;white-space:nowrap}.kidFilter input{accent-color:var(--green)}[hidden]{display:none!important}

<body><div class="shell"><nav class="nav"><div class="brand"><span class="mark">✦</span>旅遊不卡卡</div><div class="navlinks"><button data-view="smart">🎯 找活動</button><button data-view="all">🗺️ 全台活動</button><button id="randomNav">🎲 隨機抽籤</button><button id="favoritesBtn">🏆 收藏／蒐集 <span id="favCount">0</span> / <span id="collectionCount">0</span></button></div></nav>
<header class="hero"><div><div class="eyebrow">TAIWAN · LIVE EVENTS</div><h1>週末去哪？<br>去遇見一場活動。</h1><p>找正在發生、即將開始的台灣在地活動。選好條件看清單，也可以把選擇交給運氣。</p></div><aside class="heroSide">只推薦已審核、尚未結束的實體活動。活動日期與官方來源都會直接列在卡片上。</aside></header>
<main class="workspace"><aside class="panel" id="smartPanel"><div class="panelhead"><h2>智慧條件篩選</h2><span class="status">6 個條件</span></div><div class="field"><label class="label">目前位置</label><div class="row"><select id="county" aria-label="縣市"></select><select id="district" aria-label="行政區"></select></div></div><div class="field"><label class="label" for="visitDate">預計出發日期</label><input class="date-input" id="visitDate" type="date" aria-label="預計出發日期"><small class="status">只推薦當天有舉辦的活動</small></div><div class="field"><label class="label">交通工具</label><div class="chips" id="transport"><button class="chip active" data-v="汽車">🚗 汽車</button><button class="chip" data-v="摩托車">🛵 摩托車</button><button class="chip" data-v="腳踏車">🚲 腳踏車</button><button class="chip" data-v="步行">🚶 步行</button></div></div><div class="field"><label class="label">旅遊天數</label><select id="days"><option value="1">1 日遊</option><option value="2">2 日遊</option><option value="3">3 日遊</option><option value="4">4 日遊</option><option value="5">5 日遊</option></select></div><div class="field"><div class="toggle"><b>帶小孩同行</b><button class="switch" id="kids" aria-label="是否帶小孩" aria-pressed="false"></button></div></div><div class="field"><label class="label">偏好類型</label><div class="chips" id="category"><button class="chip active" data-v="不限">都可以</button><button class="chip" data-v="市區">🏙 市區</button><button class="chip" data-v="大自然">🌿 大自然</button><button class="chip" data-v="室內">☂ 室內</button></div></div><button class="primary" id="search">探索符合條件的活動</button><button class="primary random" id="random">🎲 隨機抽一個好活動</button></aside>
<section class="results"><div id="overview" hidden><h2>🗺️ 全台縣市活動總覽</h2><p class="status" id="countyStats"></p><div id="countyChips" class="chips countyChips"></div><div class="toolbar"><input id="keyword" placeholder="搜尋活動名稱" aria-label="搜尋活動名稱"><select id="sort"><option value="end">依結束日期由近到遠</option><option value="start">依開始日期排序</option></select><label class="kidFilter"><input id="onlyKids" type="checkbox"> 僅親子友善</label></div></div><div class="resulttop"><div><h2 id="resultTitle">正在載入活動…</h2><p id="resultSub">即時活動清單</p></div><div class="actions"><button class="outline" id="share">分享清單</button><button class="outline" id="showNearby">看鄰近縣市</button></div></div><div id="sourceStatus" class="status"></div><div id="cards" class="cards"></div></section></main><footer><span>旅遊不卡卡 · 台灣即時活動探索</span><span>活動以官方公告資訊為準</span></footer></div>
<div id="overlay" class="overlay"><section class="modal"><button class="close" id="close">×</button><h2 id="modalTitle">我的蒐集冊</h2><p id="modalSub"></p><div class="actions modalTabs"><button class="outline" id="modalFav">♡ 我的收藏</button><button class="outline" id="modalCollection">🏅 我的蒐集冊</button></div><div id="modalContent" class="collection"></div></section></div><div id="toast" class="toast"></div>
<script src="data/tourism-events-preview.js"></script><script src="services/eventService.js"></script><script src="data/taiwan.js"></script><script src="utils/etaService.js"></script><script>const COUNTY_DATA=TaiwanData.countyData,COUNTY_CENTER=TaiwanData.countyCenter,NEIGHBORS=TaiwanData.neighbors;
const date=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const STORAGE={fav:'event-favorites-v1',collection:'event-collection-v1'};const state={events:[],county:'台北市',district:'中正區',visitDate:date(1),transport:'汽車',days:1,kids:false,category:'不限',nearby:false,results:[],mode:'search',overviewCity:'全部縣市'};const $=s=>document.querySelector(s);const safe=(key)=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}};const put=(key,val)=>localStorage.setItem(key,JSON.stringify(val));
function escapeHtml(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadEvents(){const url=window.EVENTS_API_URL||document.querySelector('meta[name="events-api-url"]')?.content||'';const result=await EventService.load(url);state.events=result.events;$('#sourceStatus').textContent=result.source==='cloud'?`雲端活動資料 · ${state.events.length} 筆可推薦`:result.source==='local-copy'?`官方活動資料 · ${state.events.length} 筆可推薦` :result.source==='fallback'?'雲端連線失敗，暫以開發預覽活動顯示':'展示開發預覽活動 · 已自動排除待審核與過期資料';renderCountyChips()}
async function refreshAfterModeration(){await loadEvents();if(state.mode==='overview')renderOverview();else search()}
function switchView(view){const all=view==='all';$('#smartPanel').hidden=all;$('#overview').hidden=!all;$('.workspace').classList.toggle('overviewMode',all);$('#showNearby').hidden=all;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(all){renderCountyChips();renderOverview()}else search()}
function buildDistrictOptions(){const c=$('#county');Object.keys(COUNTY_DATA).forEach((name,i)=>c.add(new Option(name,name)));c.value=state.county;fillDistrict()}
function fillDistrict(){const list=COUNTY_DATA[state.county].split(' ');$('#district').replaceChildren(...list.map((x,i)=>new Option(x,x,false,i===0)));state.district=list[0]}
function initChips(id,key){document.querySelectorAll(`#${id} .chip`).forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll(`#${id} .chip`).forEach(x=>x.classList.remove('active'));b.classList.add('active');state[key]=b.dataset.v}))}
function minutes(event){const base=COUNTY_CENTER[state.county],districts=COUNTY_DATA[state.county].split(' '),index=Math.max(0,districts.indexOf(state.district));const from=[base[0]+((index%5)-2)*.009,base[1]+(Math.floor(index/5)-1)*.012];return EtaService.estimateMinutes(from,[event.lat,event.lng],state.transport,event.city!==state.county)}
function fmtEta(m){let h=Math.floor(m/60),r=m%60;return h?`${h}小時${r}分鐘`:`${r}分鐘`}
function dateTag(e){const today=date(0),now=e.start_date<=today&&e.end_date>=today,diff=Math.round((new Date(e.end_date+'T00:00:00')-new Date(today+'T00:00:00'))/86400000),fullDate=d=>`${d.slice(0,4)}/${d.slice(5,7)}/${d.slice(8,10)}`;return`<span class="tag ${diff<=3?'hot':''}">${now?'進行中 · ':''}📅 ${fullDate(e.start_date)} - ${fullDate(e.end_date)}${diff<=3?' · 即將結束':''}</span>`}
function shiftDate(value,offset){const d=new Date(value+'T00:00:00');d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function filterEvents(){let list=state.events.filter(e=>e.start_date<=state.visitDate&&e.end_date>=state.visitDate&&(state.nearby?[state.county,...(NEIGHBORS[state.county]||[])].includes(e.city):e.city===state.county)&&(!state.kids||e.kid_friendly)&&(state.category==='不限'||e.category===state.category));return list.sort((a,b)=>minutes(a)-minutes(b))}
function recommendDays(){const pool=state.events.filter(e=>(!state.kids||e.kid_friendly)&&(state.category==='不限'||e.category===state.category)).sort((a,b)=>minutes(a)-minutes(b)),days=Number(state.days),used=new Set(),groups=[];for(let day=1;day<=days;day++){const visitDay=shiftDate(state.visitDate,day-1),dayPool=pool.filter(e=>e.start_date<=visitDay&&e.end_date>=visitDay),countyOrder=day===1?[state.county]:[...(NEIGHBORS[state.county]||[]),state.county,...Object.keys(COUNTY_CENTER).filter(c=>c!==state.county)];let chosen=null;for(const c of countyOrder){chosen=dayPool.find(e=>e.city===c&&!used.has(e.id));if(chosen)break}if(chosen){used.add(chosen.id);groups.push({...chosen,day_number:day})}}return groups}
function renderCountyChips(){const counts=Object.fromEntries(Object.keys(COUNTY_DATA).map(c=>[c,state.events.filter(e=>e.city===c).length]));$('#countyStats').textContent=`全台 ${state.events.length} 場活動 · 22 縣市 · `+Object.entries(counts).filter(([,n])=>n>0).length+' 個縣市目前有活動';$('#countyChips').innerHTML=[`全部縣市 (${state.events.length})`,...Object.keys(COUNTY_DATA).map(c=>`${c} (${counts[c]})`)].map((label,i)=>`<button class="chip ${i===0?state.overviewCity==='全部縣市'?'active':'':state.overviewCity===label.split(' (')[0]?'active':''}" data-city="${i===0?'全部縣市':label.split(' (')[0]}">${escapeHtml(label)}</button>`).join('');$('#countyChips').querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{state.overviewCity=b.dataset.city;renderCountyChips();renderOverview()})}
function renderOverview(){let q=$('#keyword').value.trim().toLowerCase(),list=state.events.filter(e=>(state.overviewCity==='全部縣市'||e.city===state.overviewCity)&&(!$('#onlyKids').checked||e.kid_friendly)&&(!q||e.title.toLowerCase().includes(q)));list.sort((a,b)=>$('#sort').value==='start'?a.start_date.localeCompare(b.start_date):a.end_date.localeCompare(b.end_date));state.days=1;state.mode='overview';render(list,`${state.overviewCity} · ${list.length} 場活動`,'全台已審核且尚未結束的活動 · 點選縣市標籤快速篩選')}
function render(list,title,sub){state.results=list;$('#resultTitle').textContent=title;$('#resultSub').textContent=sub;const el=$('#cards');if(!list.length){el.innerHTML=`<div class="empty"><strong>這組條件暫時沒有活動</strong><div>活動資料會持續更新。放寬偏好，或直接瀏覽全台活動。</div><div><button class="outline" id="relax">放寬條件</button> <button class="outline" id="emptyAll">查看全部縣市活動</button></div></div>`;$('#relax').onclick=()=>{state.category='不限';state.kids=false;document.querySelector('#category [data-v="不限"]').click();$('#kids').classList.remove('on');$('#kids').setAttribute('aria-pressed','false');search()};$('#emptyAll').onclick=()=>switchView('all');return}el.innerHTML=list.map((e,i)=>card(e,i)).join('');el.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFavorite(b.dataset.fav));el.querySelectorAll('[data-collect]').forEach(b=>b.onclick=()=>collect(b.dataset.collect))}
function card(e,i){const fav=safe(STORAGE.fav).some(x=>x.id===e.id),col=safe(STORAGE.collection).some(x=>x.id===e.id),m=minutes(e);const day=state.days>1&&state.mode==='search'?`<span class="tag">Day ${e.day_number||i+1}</span>`:'';return`<article class="card"><div><h3>${escapeHtml(e.title)}</h3><div class="meta">${dateTag(e)} ${day}<span class="tag">${escapeHtml(e.city)} ${escapeHtml(e.district||'')}</span><span class="tag">${escapeHtml(e.category)}</span>${e.kid_friendly?'<span class="tag">親子友善</span>':''}</div><p class="summary">${escapeHtml(e.summary||'活動亮點詳見官方公告。')}</p><div class="eta">預估車程 ${fmtEta(m)} <span style="font-weight:400;color:var(--muted)">· ${state.transport}估算</span></div></div><div class="cardActions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${e.lat},${e.lng}`)}&travelmode=${mapMode()}">開始導航 ↗</a><a target="_blank" rel="noopener" href="${escapeHtml(e.source_url||'#')}">官方公告 ↗</a><button class="${fav?'saved':''}" data-fav="${escapeHtml(e.id)}">${fav?'♥ 已收藏':'♡ 收藏'}</button><button data-collect="${escapeHtml(e.id)}">${col?'🏅 已蒐集':'📍 現場打卡'}</button></div></article>`}
function mapMode(){return EtaService.mapMode(state.transport)}
function search(){state.days=Number($('#days').value);state.mode='search';let list=state.days===1?filterEvents():recommendDays();render(list,`符合條件的活動 · ${list.length}`,`${state.county} ${state.district} 出發 · ${state.visitDate} 起 · ${state.days} 日遊 · ${state.nearby?'含鄰近縣市':'先看目前縣市'}`)}
function toggleFavorite(id){const event=state.events.find(x=>x.id===id);let fav=safe(STORAGE.fav);fav=fav.some(x=>x.id===id)?fav.filter(x=>x.id!==id):[event,...fav];put(STORAGE.fav,fav);updateCounts();render(state.results,$('#resultTitle').textContent,$('#resultSub').textContent);toast(fav.some(x=>x.id===id)?'已加入收藏':'已取消收藏')}
function collect(id){let c=safe(STORAGE.collection);if(c.some(x=>x.id===id))return toast('這個活動已蒐集');const event=state.events.find(x=>x.id===id);c.unshift({...event,collected_at:new Date().toISOString()});put(STORAGE.collection,c);updateCounts();render(state.results,$('#resultTitle').textContent,$('#resultSub').textContent);toast('打卡完成，已加入活動蒐集冊')}
function updateCounts(){$('#favCount').textContent=safe(STORAGE.fav).length;$('#collectionCount').textContent=safe(STORAGE.collection).length}
function openModal(kind){const data=safe(kind==='fav'?STORAGE.fav:STORAGE.collection),cities={};data.forEach(e=>cities[e.city]=(cities[e.city]||0)+1);$('#modalTitle').textContent=kind==='fav'?'♡ 我的收藏':'🏆 我的活動蒐集冊';$('#modalSub').textContent=(kind==='fav'?`收藏 ${data.length} 場活動`:`已解鎖 ${data.length} 枚徽章 · ${Object.entries(cities).map(([c,n])=>`${c} ${n}`).join('、')||'尚無縣市紀錄'} · 過期活動仍永久保留`);$('#modalContent').innerHTML=data.length?data.map(e=>`<article class="badge on">${kind==='fav'?'♡':'🏅'} ${escapeHtml(e.title)}<small>${escapeHtml(e.city)} ${escapeHtml(e.district)} · ${escapeHtml(e.start_date)} 至 ${escapeHtml(e.end_date)}</small></article>`).join(''):'<div class="empty"><strong>這裡還沒有活動</strong><div>找到喜歡的活動後就能加入。</div></div>';$('#overlay').classList.add('open')}
function drawRandom(){const button=$('#random');if(!state.events.length)return toast('目前沒有可抽選的活動');button.classList.add('drawing');button.disabled=true;toast('籤筒轉呀轉…');setTimeout(()=>{const e=state.events[Math.floor(Math.random()*state.events.length)];state.days=1;state.mode='random';render([e],'🎲 抽到一場好活動','隨機從全台已審核、尚未結束的活動中抽選 · 不受縣市條件限制');button.classList.remove('drawing');button.disabled=false},650)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
buildDistrictOptions();initChips('transport','transport');initChips('category','category');$('#county').onchange=()=>{state.county=$('#county').value;fillDistrict()};$('#district').onchange=()=>state.district=$('#district').value;$('#days').onchange=()=>state.days=Number($('#days').value);$('#kids').onclick=e=>{state.kids=!state.kids;e.currentTarget.classList.toggle('on',state.kids);e.currentTarget.setAttribute('aria-pressed',String(state.kids))};$('#search').onclick=search;$('#random').onclick=drawRandom;$('#showNearby').onclick=()=>{state.nearby=!state.nearby;$('#showNearby').textContent=state.nearby?'只看目前縣市':'看鄰近縣市';search()};$('#share').onclick=async()=>{if(!state.results.length)return toast('目前沒有活動可以分享');const text='台灣活動清單\n'+state.results.map((e,i)=>`${i+1}. ${e.title}（${e.city} ${e.district}，${e.start_date}～${e.end_date}）\n${e.source_url||''}`).join('\n')+'\n\n旅遊不卡卡';try{if(navigator.share)await navigator.share({title:'台灣活動清單',text});else{await navigator.clipboard.writeText(text);toast('活動清單已複製')}}catch(err){if(err.name!=='AbortError')toast('無法分享，請稍後再試')}};$('#favoritesBtn').onclick=()=>openModal('fav');$('#close').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('open')};updateCounts();loadEvents().then(search);
if('BroadcastChannel'in window){const eventChannel=new BroadcastChannel('travel-events');eventChannel.onmessage=e=>{if(e.data==='updated')refreshAfterModeration()}}
window.addEventListener('storage',e=>{if(e.key==='travel-events-updated')refreshAfterModeration()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#randomNav').onclick=()=>{switchView('smart');drawRandom()};$('#keyword').oninput=()=>renderOverview();$('#sort').onchange=()=>renderOverview();$('#onlyKids').onchange=()=>renderOverview();$('#modalFav').onclick=()=>openModal('fav');$('#modalCollection').onclick=()=>openModal('collection');</script></body></html>
